# Lazygit Configuration Reference
# Uncomment and modify only the settings you want to change from defaults

# ============================================================================
# GUI SETTINGS
# ============================================================================

# gui:
#   # Custom colors for commit authors
#   authorColors: {}
#
#   # Custom branch color patterns
#   branchColorPatterns: {}
#
#   # Custom icons for files
#   customIcons:
#     filenames: {}
#     extensions: {}
#
#   # Scroll settings
#   scrollHeight: 2
#   scrollPastBottom: true
#   scrollOffMargin: 2
#   scrollOffBehavior: margin  # margin | jump
#
#   # Tab width for diffs
#   tabWidth: 4
#
#   # Mouse capture (makes text selection harder)
#   mouseEvents: true
#
#   # Skip confirmation warnings
#   skipAmendWarning: false
#   skipDiscardChangeWarning: false
#   skipStashWarning: false
#   skipNoStagedFilesWarning: false
#   skipRewordInEditorWarning: false
#   skipSwitchWorktreeOnCheckoutWarning: false
#
#   # Layout
#   sidePanelWidth: 0.3333
#   expandFocusedSidePanel: false
#   expandedSidePanelWeight: 2
#   shrinkSidePanelsToContent: false
#
#   # Side panels order (tabs grouped together)
#   sidePanels:
#     - [status]
#     - [files, worktrees, submodules]
#     - [branches, remotes, tags]
#     - [commits, reflog]
#     - [stash]
#
#   # Split mode for main window
#   mainPanelSplitMode: flexible  # horizontal | vertical | flexible
#   enlargedSideViewLocation: left  # left | top
#
#   # Staging view
#   wrapLinesInStagingView: true
#   useHunkModeInStagingView: true
#
#   # Language and time format
#   language: auto  # auto | en | zh-CN | zh-TW | pl | nl | ja | ko | ru | pt
#   timeFormat: 02 Jan 06
#   shortTimeFormat: 3:04PM
#
#   # Theme colors
#   theme:
#     activeBorderColor: [green, bold]
#     inactiveBorderColor: [default]
#     searchingActiveBorderColor: [cyan, bold]
#     optionsTextColor: [blue]
#     selectedLineBgColor: [blue]
#     inactiveViewSelectedLineBgColor: [bold]
#     cherryPickedCommitFgColor: [blue]
#     cherryPickedCommitBgColor: [cyan]
#     markedBaseCommitFgColor: [blue]
#     markedBaseCommitBgColor: [yellow]
#     unstagedChangesColor: [red]
#     defaultFgColor: [default]
#
#   # Commit display
#   commitLength:
#     show: true
#   commitAuthorShortLength: 2
#   commitAuthorLongLength: 17
#   commitHashLength: 8
#   showBranchCommitHash: false
#   showDivergenceFromBaseBranch: none  # none | onlyArrow | arrowAndNumber
#
#   # UI elements visibility
#   showListFooter: true
#   showFileTree: true
#   showRootItemInFileTree: true
#   fileTreeSortOrder: mixed  # mixed | filesFirst | foldersFirst
#   fileTreeSortCaseSensitive: true
#   showNumstatInFilesView: false
#   showRandomTip: true
#   showCommandLog: true
#   showBottomLine: true
#   showPanelJumps: true
#   commandLogSize: 8
#
#   # Nerd fonts (requires Nerd Font installed)
#   nerdFontsVersion: ""  # "" | "2" | "3"
#   showFileIcons: true
#
#   # Window settings
#   splitDiff: auto  # auto | always
#   screenMode: normal  # normal | half | full
#   border: rounded  # rounded | single | double | hidden | bold
#   animateExplosion: true
#   portraitMode: auto  # auto | always | never
#   portraitModeAutoMaxWidth: 84
#   portraitModeAutoMinHeight: 46
#
#   # Search/filter
#   filterMode: substring  # substring | fuzzy
#
#   # Spinner animation
#   spinner:
#     frames: [●∙∙, ∙●∙, ∙∙●, ∙●∙]
#     rate: 180
#
#   # Status panel
#   statusPanelView: dashboard  # dashboard | allBranchesLog
#   switchToFilesAfterStashPop: true
#   switchToFilesAfterStashApply: true
#   switchTabsWithPanelJumpKeys: false

